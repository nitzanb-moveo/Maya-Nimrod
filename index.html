<title>Maya &amp; Nimrod Pop Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,600..900,0..100,0..1;1,9..144,600..900,0..100,0..1&family=Suez+One&display=swap">
<style>
/* Layout: one fixed 1280x720 storybook stage scaled to fit a projector, a slim control strip under it. Single committed look (risograph fairy-tale), no theme switch. */
:root{
  --ink:#1a1a1a; --paper:#fbf0e2; --pink:#f285b8; --pinkD:#d81b60; --peri:#7686e0; --periD:#5563c4; --lilac:#a884b1; --turq:#4dd0e1;
  --sky:#a8dcea; --grass:#4a8b58; --grassD:#336b41; --mustard:#fbc02d; --coral:#e2603a;
  --cabinet:#2e2b5e;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --ui:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --he:"Suez One", "Fraunces", Georgia, serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--cabinet);color:var(--paper);padding-inline:16px;padding-block:12px;box-sizing:border-box;
  display:flex;flex-direction:column;gap:10px;overflow:hidden;font-family:var(--ui)}
#wrap{flex:1;min-height:0;position:relative}
#wrap:fullscreen{background:#000}
#frame{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:50% 50%;overflow:hidden;
  background:var(--sky);outline:3px solid var(--ink);box-shadow:0 0 0 8px var(--paper), 10px 14px 0 8px #1b1840;border-radius:4px;color:var(--ink);user-select:none}
#grain{position:absolute;inset:0;pointer-events:none;z-index:60;mix-blend-mode:multiply;opacity:.32;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .13 0 0 0 0 .1 0 0 0 0 .17 2.4 0 0 0 -1.2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#paper{position:absolute;inset:0;pointer-events:none;z-index:59;opacity:.12;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.02' numOctaves='3'/><feColorMatrix values='0 0 0 0 .4 0 0 0 0 .3 0 0 0 0 .5 0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>")}
.scene{position:absolute;inset:0;overflow:hidden}
.scene[hidden]{display:none!important}
svg{display:block;overflow:visible}
.abs{position:absolute}

.kicker{font:800 14px/1 var(--ui);letter-spacing:.24em;text-transform:uppercase}
.btn{font:800 17px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--paper);
  border:2px solid var(--ink);border-radius:999px;padding:13px 22px;box-shadow:3px 3px 0 var(--ink);cursor:pointer}
.btn:active,.btn.on{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}

/* characters: viewBox -40 -50 280 500, soles at y434 */
.char{position:absolute;width:196px;height:350px}
.char svg{width:100%;height:100%}
.char.flip svg{transform:scaleX(-1)}
.char .body,.char .legL,.char .legR,.char .armL,.char .armR{transform-box:view-box}
.char .body{transform-origin:100px 236px;animation:breathe 2.6s ease-in-out infinite}
.char.walk .body{animation:bob .28s ease-in-out infinite alternate}
.char.walk .legL{animation:swing .56s ease-in-out infinite alternate}
.char.walk .legR{animation:swing .56s ease-in-out infinite alternate-reverse}
.char.walk .armL{animation:swing2 .56s ease-in-out infinite alternate-reverse}
.char.walk .armR:not(.up){animation:swing2 .56s ease-in-out infinite alternate}
.char.sneeze .body{animation:sneeze .5s ease-out}
@keyframes swing{from{transform:rotate(15deg)}to{transform:rotate(-15deg)}}
@keyframes swing2{from{transform:rotate(11deg)}to{transform:rotate(-11deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-6px)}}
@keyframes breathe{50%{transform:translateY(-2px)}}
@keyframes sneeze{0%{transform:rotate(0)}25%{transform:rotate(-7deg)}45%{transform:rotate(12deg) translateY(4px)}100%{transform:rotate(0)}}
.sombrero{transform-box:view-box;transform-origin:100px 30px;transform:translateY(-760px)}
.sombrero.drop{animation:drop .9s cubic-bezier(.3,1.4,.6,1) forwards}
@keyframes drop{0%{transform:translateY(-760px) rotate(-12deg)}70%{transform:translateY(8px) rotate(4deg)}100%{transform:translateY(0) rotate(0)}}
.char.morph svg{animation:morph .45s cubic-bezier(.3,1.5,.5,1)}
.char.flip.morph svg{animation:morphF .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes morph{0%{transform:scale(.2,1.1)}60%{transform:scale(1.08,.96)}100%{transform:none}}
@keyframes morphF{0%{transform:scale(-.2,1.1)}60%{transform:scale(-1.08,.96)}100%{transform:scaleX(-1)}}

/* title */
#sc-title .top{left:0;right:0;top:28px;display:flex;justify-content:space-between;padding:0 56px;color:var(--ink)}
#sc-title h1{position:absolute;left:0;right:0;top:58px;margin:0;text-align:center;font:900 140px/0.9 var(--display);color:var(--paper);text-shadow:6px 6px 0 var(--coral)}
#sc-title h1 i{font-style:italic;font-weight:600;font-size:.6em;color:var(--mustard);text-shadow:4px 4px 0 var(--ink)}
#sc-title .sub{left:0;right:0;top:196px;text-align:center;font:800 italic 40px/1 var(--display);color:var(--mustard);text-shadow:3px 3px 0 var(--ink)}
#sc-title .start{left:50%;top:600px;transform:translateX(-50%);font-size:20px;padding:16px 30px;background:var(--mustard)}

/* select */
#sc-select .head{left:0;right:0;top:20px;text-align:center;z-index:3}
#sc-select .head h2{margin:0;font:900 52px/1 var(--display);color:var(--paper);text-shadow:4px 4px 0 var(--ink)}
.half{position:absolute;top:0;width:640px;height:720px;overflow:hidden;transition:background .35s}
.half .disc{position:absolute;top:150px;width:420px;height:420px}
.half .disc svg{width:100%;height:100%}
.half .disc.spin svg{animation:discIn .5s cubic-bezier(.3,1.4,.5,1)}
@keyframes discIn{from{transform:scale(.6) rotate(-30deg);opacity:.2}}
.half .look{position:absolute;left:0;right:0;bottom:24px;text-align:center;z-index:2}
.half .look b{display:inline-block;font:900 italic 40px/1 var(--display);color:var(--paper);text-shadow:4px 4px 0 var(--ink);transform:rotate(-3deg)}
.card{position:absolute;top:100px;width:330px;height:456px;display:flex;flex-direction:column;background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:8px 8px 0 var(--ink);padding:16px 20px 16px;box-sizing:border-box;z-index:3}
.card .who{display:flex;align-items:center;justify-content:space-between}
.card .who b{font:900 40px/1 var(--display)}
.card .who span{font:800 13px/1 var(--ui);letter-spacing:.16em;background:var(--ink);color:var(--paper);padding:6px 9px;border-radius:6px}
.chips{display:flex;gap:6px;margin:12px 0 14px}
.chip{flex:1;font:800 12px/1.15 var(--ui);letter-spacing:.04em;text-transform:uppercase;padding:8px 4px;border:2.5px solid var(--ink);border-radius:10px;background:transparent;color:var(--ink);cursor:pointer;min-height:46px}
.chip.on{background:var(--ink);color:var(--paper)}
.trait{margin-bottom:10px}
.trait em{display:inline-block;font:800 12px/1 var(--ui);letter-spacing:.2em;font-style:normal;padding:5px 8px;border-radius:6px;border:2px solid var(--ink);margin-bottom:6px}
.trait.s em{background:var(--grass);color:var(--paper)}
.trait.w em{background:var(--coral);color:var(--paper)}
.trait p{margin:0;font:600 20px/1.3 var(--ui)}
.card .row{margin-top:auto}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card .keys{font:700 13px/1.3 var(--ui);opacity:.75}
.card .ok{position:absolute;right:-18px;top:-24px;font:900 32px/1 var(--display);color:var(--paper);background:var(--grass);border:3px solid var(--ink);border-radius:999px;padding:10px 18px;transform:rotate(9deg) scale(0);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.card.ready .ok{transform:rotate(9deg) scale(1)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:2}
.flash.go{animation:flash .4s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}

/* path lanes */
.lane{position:absolute;top:0;width:640px;height:720px;overflow:hidden}
.lane.nim{left:0}.lane.maya{left:640px}
.layer{position:absolute;left:0;top:0;height:720px;will-change:transform}
.item{position:absolute;top:178px;width:120px;text-align:center;transition:transform .5s cubic-bezier(.3,1.4,.5,1),opacity .5s}
.item svg{width:104px;height:104px;margin:0 auto;animation:float 2.4s ease-in-out infinite}
.item span{display:inline-block;margin-top:2px;font:800 15px/1.1 var(--ui);letter-spacing:.06em;text-transform:uppercase;background:var(--paper);border:2.5px solid var(--ink);border-radius:8px;padding:5px 9px;white-space:nowrap;box-shadow:3px 3px 0 var(--ink)}
.item.got{transform:translateY(-190px) scale(.35);opacity:0}
@keyframes float{50%{transform:translateY(-8px)}}
.npc{position:absolute;top:0;width:300px;height:720px;pointer-events:none}
.npc .char{left:52px;top:311px}
.npc.fly .char{transition:transform 1s cubic-bezier(.5,-0.4,.8,.6),opacity 1s;transform:translate(var(--fx),-560px) rotate(var(--fr));opacity:0}
.npc .deco{position:absolute;left:0;top:0;width:300px;height:720px;transition:opacity .6s}
.bubble{position:absolute;left:4px;width:292px;top:92px;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:12px 16px 12px;box-sizing:border-box;
  box-shadow:6px 6px 0 var(--ink);opacity:0;transform:translateY(10px) scale(.9);transition:.25s;z-index:3}
.bubble.show{opacity:1;transform:none}
.bubble:after{content:"";position:absolute;left:134px;bottom:-16px;width:24px;height:24px;background:#fff;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg)}
.bubble .flag{display:inline-block;font:800 13px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--paper);background:var(--coral);border:2px solid var(--ink);border-radius:6px;padding:5px 8px;margin-bottom:8px}
.bubble p{margin:0;font:700 20px/1.25 var(--ui);min-height:50px}
.bubble small{display:block;margin-top:8px;font:800 13px/1 var(--ui);letter-spacing:.12em;color:var(--pinkD)}
.stamp{position:absolute;left:60px;top:360px;width:180px;height:180px;display:grid;place-items:center;transform:scale(2.4) rotate(-20deg);opacity:0;transition:transform .25s cubic-bezier(.4,1.6,.6,1),opacity .15s;z-index:4}
.stamp.show{transform:scale(1) rotate(-12deg);opacity:1}
.stamp .x{width:170px;height:170px;border-radius:50%;border:9px solid var(--coral);display:grid;place-items:center;font:900 130px/1 var(--display);color:var(--coral);background:rgba(251,240,226,.6)}
.verdict{position:absolute;left:0;right:0;top:118px;text-align:center;z-index:7;opacity:0;transform:scale(.4) rotate(-8deg);transition:transform .3s cubic-bezier(.3,1.7,.5,1),opacity .2s;pointer-events:none}
.verdict.show{opacity:1;transform:rotate(-4deg)}
.verdict b{display:block;font:900 108px/0.9 var(--display);color:var(--coral);text-shadow:5px 5px 0 var(--ink);-webkit-text-stroke:2px var(--ink)}
.verdict span{display:inline-block;margin-top:10px;font:800 30px/1 var(--ui);letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:12px;transform:rotate(3deg)}
.hud{position:absolute;left:16px;right:16px;top:14px;display:flex;flex-direction:column;gap:8px;z-index:6}
.hud .tag{display:flex;align-items:center;gap:10px}
.hud .tag b{font:900 38px/1 var(--display);color:var(--paper);text-shadow:3px 3px 0 var(--ink)}
.hud .tag .nopes{margin-left:auto;font:800 16px/1 var(--ui);letter-spacing:.1em;background:var(--paper);color:var(--ink);border:2.5px solid var(--ink);padding:7px 10px;border-radius:8px}
.tray{display:flex;flex-wrap:wrap;gap:2px;min-height:40px}
.tray svg{width:40px;height:40px;animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.maya .hud{align-items:flex-end}.maya .hud .tag{flex-direction:row-reverse}.maya .hud .tag .nopes{margin-left:0;margin-right:auto}.maya .tray{justify-content:flex-end}
@keyframes pop{from{transform:scale(.5)}}
.ctrl{position:absolute;bottom:18px;display:flex;gap:10px;z-index:6}
.nim .ctrl{left:18px}.maya .ctrl{right:18px}
.ctrl .btn{font-size:14px;padding:11px 15px;touch-action:none}
.ctrl .nope{background:var(--coral);color:var(--paper)}
.lane .note{position:absolute;left:0;right:0;top:150px;text-align:center;font:900 38px/1.1 var(--display);color:var(--paper);text-shadow:4px 4px 0 var(--ink);opacity:0;transition:opacity .4s;z-index:6}
.lane .note.show{opacity:1}
#divider{position:absolute;left:633px;top:0;width:14px;height:720px;background:repeating-linear-gradient(180deg,var(--mustard) 0 20px,var(--coral) 20px 40px,var(--pink) 40px 60px);border-inline:3px solid var(--ink);box-sizing:border-box;z-index:8;transition:opacity .8s,transform .8s}
#sc-path.dissolve #divider{opacity:0;transform:scaleY(0)}
.fx{position:absolute;pointer-events:none;z-index:20}

/* meet */
#meetWorld{position:absolute;inset:0;transition:transform 1.1s cubic-bezier(.6,0,.3,1)}
#meetWorld.slide{transform:translateX(-300px)}
.sign-lit{animation:flicker 1.2s steps(1) forwards}
@keyframes flicker{0%{opacity:.2}10%{opacity:1}18%{opacity:.3}30%{opacity:1}40%{opacity:.5}55%,100%{opacity:1}}
.ole{position:absolute;left:640px;top:230px;transform:translate(-50%,0) scale(0) rotate(-8deg);font:900 italic 80px/1 var(--display);color:var(--mustard);text-shadow:5px 5px 0 var(--ink);transition:transform .4s cubic-bezier(.3,1.7,.5,1),opacity .6s;z-index:5}
.ole.show{transform:translate(-50%,0) scale(1) rotate(-8deg)}
#check{position:absolute;left:700px;top:60px;width:550px;background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:9px 9px 0 var(--ink);padding:20px 26px;box-sizing:border-box;transform:translateX(660px);transition:transform 1.1s cubic-bezier(.6,0,.3,1);z-index:4}
#check.in{transform:none}
#check h3{margin:0 0 4px;font:900 40px/1 var(--display)}
#check .kicker{color:var(--pinkD);margin-bottom:8px}
.crow{display:grid;grid-template-columns:56px 1fr 96px;gap:12px;align-items:center;padding:8px 0;border-bottom:2.5px dashed rgba(34,28,43,.35);font:700 20px/1.2 var(--ui)}
.crow svg{width:56px;height:56px}
.crow .pass{justify-self:end;font:900 17px/1 var(--ui);letter-spacing:.1em;color:var(--paper);background:var(--grass);border:3px solid var(--ink);border-radius:9px;padding:8px 10px;transform:scale(0) rotate(-10deg);transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
.crow.ok .pass{transform:scale(1) rotate(-6deg)}
.meter{margin-top:14px;display:grid;grid-template-columns:1fr 78px;gap:12px;align-items:center}
.meter .bar{height:24px;border:3px solid var(--ink);border-radius:14px;background:#fff;overflow:hidden}
.meter .bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--pinkD) 0 10px,var(--pink) 10px 20px);transition:width .5s}
.meter b{font:900 32px/1 var(--display);font-variant-numeric:tabular-nums;text-align:right}
#match{position:absolute;right:40px;top:0;bottom:0;width:600px;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .4s;z-index:6}
#match.show{opacity:1}
#match .ban{text-align:center;background:var(--pinkD);border:3px solid var(--ink);border-radius:26px;box-shadow:10px 10px 0 var(--ink);padding:28px 44px 24px;transform:scale(.3) rotate(-6deg);transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
#match.show .ban{transform:scale(1) rotate(-3deg)}
#match .ban b{display:block;font:900 86px/0.95 var(--display);color:var(--paper);text-shadow:4px 4px 0 var(--ink)}
#match .ban span{display:block;font:800 20px/1 var(--ui);letter-spacing:.28em;color:var(--mustard);margin-bottom:12px}
.prompt{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);font:800 16px/1 var(--ui);letter-spacing:.2em;background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:999px;white-space:nowrap;z-index:9}

/* nosebleed */
.nose{position:absolute;left:92px;top:89px;width:14px;height:44px;pointer-events:none;z-index:2}
.nose b{position:absolute;left:2px;top:0;width:3px;height:11px;background:#d8232a;border-radius:2px;box-shadow:6px 1px 0 #d8232a}
.nose i{position:absolute;left:1px;top:6px;width:9px;height:12px;background:#d8232a;border:1.5px solid var(--ink);border-radius:50% 50% 50% 50%/40% 40% 60% 60%;animation:drip 1.1s ease-in infinite}
.nose i+i{animation-delay:.55s}
@keyframes drip{0%{transform:translateY(0) scale(.3);opacity:0}25%{transform:translateY(2px) scale(1);opacity:1}100%{transform:translateY(34px) scale(.8);opacity:0}}

/* chuppah */
.wflash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:7}
.wflash.go{animation:flash .7s ease-out}
.chdone{left:0;right:0;top:34px;text-align:center;z-index:6;opacity:0;transform:scale(.4) rotate(-6deg);transition:transform .5s cubic-bezier(.3,1.6,.5,1),opacity .3s}
.chdone.show{opacity:1;transform:rotate(-2deg)}
.chdone span{display:inline-block;font:800 20px/1 var(--ui);letter-spacing:.2em;text-transform:uppercase;background:var(--mustard);border:2px solid var(--ink);border-radius:10px;padding:9px 14px;box-shadow:3px 3px 0 var(--ink)}
.chdone b{display:block;margin-top:12px;font:900 88px/1 var(--display);color:var(--pinkD);text-shadow:5px 5px 0 var(--ink);-webkit-text-stroke:2px var(--ink)}
.chheart{width:44px;height:44px;z-index:5}

/* outro */
#sc-outro .he{left:0;right:0;top:22px;text-align:center;font:400 112px/1 var(--he);color:var(--paper);text-shadow:5px 5px 0 var(--coral);direction:rtl}
#sc-outro .names{left:0;right:0;top:142px;text-align:center;font:900 58px/1 var(--display);color:var(--ink)}
#sc-outro .names i{font-weight:600;color:var(--mustard);text-shadow:3px 3px 0 var(--ink)}
#sc-outro .line{left:0;right:0;top:210px;text-align:center;font:700 23px/1.3 var(--ui);color:var(--ink)}
.polas{position:absolute;left:0;right:0;top:262px;display:flex;justify-content:center;gap:40px}
.pola{background:#fff;border:3px solid var(--ink);padding:12px 12px 0;box-shadow:7px 7px 0 var(--ink);position:relative}
.pola img{display:block;width:280px;height:230px;object-fit:cover;border:2px solid var(--ink)}
.pola span{display:block;text-align:center;font:600 italic 22px/1 var(--display);padding:12px 0 14px}
.pola:before{content:"";position:absolute;left:50%;top:-16px;width:96px;height:30px;margin-left:-48px;background:rgba(245,155,198,.9);border:2px solid var(--ink);transform:rotate(-4deg)}
.tbc{left:0;right:0;top:20px;text-align:center}
.tbc b{display:block;font:900 92px/1 var(--display);color:var(--paper);text-shadow:5px 5px 0 var(--ink)}
.tbc span{display:inline-block;margin-top:14px;font:800 26px/1 var(--ui);letter-spacing:.08em;background:var(--mustard);border:3px solid var(--ink);padding:12px 20px;border-radius:12px;box-shadow:5px 5px 0 var(--ink)}
.load{position:absolute;left:450px;right:450px;top:200px;z-index:4;background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:8px 12px;box-shadow:4px 4px 0 var(--ink)}
.load .kicker{color:var(--ink);margin-bottom:8px;display:flex;justify-content:space-between}
.load .bar{height:18px;border:2.5px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden}
.load .bar i{display:block;height:100%;width:1%;background:var(--grass);transition:width 1.2s}

#wipe{position:absolute;inset:0;z-index:70;background:var(--pinkD);clip-path:circle(0% at 50% 50%);pointer-events:none;transition:clip-path .55s cubic-bezier(.7,0,.3,1)}
#wipe.cover{clip-path:circle(80% at 50% 50%)}

.strip{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;font:600 12px/1.5 var(--ui);color:#d7d4f5}
.strip .keys{display:flex;flex-wrap:wrap;gap:8px 24px;min-width:0}
.strip .keys span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.strip .keys b{color:var(--mustard);font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-inline-end:4px}
.strip .keys i{font-style:normal;opacity:.5;margin:0 2px}
.strip kbd{font:800 11px/1 var(--ui);color:var(--paper);background:rgba(255,255,255,.08);border:1.5px solid #8f8ad6;border-radius:5px;padding:4px 6px 3px;box-shadow:0 2px 0 #8f8ad6;min-width:10px;text-align:center}
.strip .btns{display:flex;gap:8px;flex-wrap:wrap}
.strip button{font:800 11px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;background:transparent;color:var(--paper);border:2px solid #8f8ad6;border-radius:999px;padding:8px 12px;cursor:pointer;min-height:34px}
.strip button:hover{border-color:var(--mustard);color:var(--mustard)}
.strip button:focus-visible{outline:2px solid var(--mustard);outline-offset:2px}
@media (prefers-reduced-motion:reduce){ .char .body,.char.walk .body,.item svg,.pulse{animation:none!important} }
/* 70s storybook finish: soft wonky serif, badges with hard 3px shadows */
*{font-variation-settings:"SOFT" 100,"WONK" 1}
.card .who span,.trait em,.item span,.bubble .flag,.hud .tag .nopes,.prompt,.crow .pass,.tbc span,.chip.on,.verdict span{box-shadow:3px 3px 0 var(--ink)}
.item span,.hud .tag .nopes,.chip,.bubble .flag,.trait em{border-width:2px}
.bubble,.card,#check{border-width:2.5px;border-radius:24px}
.load{border-width:2px;border-radius:16px}
#match .ban{border-radius:28px}

      + P('M86 108 L96 164 L80 150 L74 116Z', '#2d2f5c', 1.4) + P('M114 108 L104 164 L120 150 L126 116Z', '#2d2f5c', 1.4)

scenes.outro = {
  enter() { ST.phase = 0; this.phase0(); playSong('sunny'); },

    $('#sc-outro').innerHTML = `<svg class="abs" width="1280" height="720" viewBox="0 0 1280 720">

        ${bush(80, 716, 200, C.grassD, 2, C.mustard)}${bush(1200, 716, 200, C.grassD, 4, C.pinkD)}
      </svg>
      <div class="abs he">מזל טוב!</div>
      <div class="abs names">Maya <i>&amp;</i> Nimrod</div>

      <div class="polas">
        <div class="pola" style="transform:rotate(-5deg)"><img alt="Maya and Nimrod above a green river gorge" src="${PHOTOS.gorge}"><span>Above the gorge</span></div>

  },
  update(dt) {
    ST.t += dt;
    if (ST.phase === 1) {
      const target = Math.min(7, 1 + Math.floor(ST.t / 1.4));
      if (target !== ST.load) { ST.load = target; $('.load i').style.width = target + '%'; $('.load .pc').textContent = target + '%'; }
    }
    if (pressed('Enter', 'Space')) {
      if (ST.phase === 0) { ST.phase = 1; ST.t = 0; sfx.whoosh(); this.phase1(); }
      else go('title');
    }
  },
};

// ---------- loop, scaling, buttons ----------
let last = performance.now();
function frame(ts) {
  const dt = Math.min(.05, (ts - last) / 1000); last = ts;
  readPads();
  if (ST.lock > 0) ST.lock -= dt;
  else if (!busy && scenes[SC].update) scenes[SC].update(dt);
  for (const k in edge) edge[k] = false;
  requestAnimationFrame(frame);
}
const wrap = $('#wrap'), frameEl = $('#frame');
function fit() { const s = Math.min(wrap.clientWidth / 1300, wrap.clientHeight / 740); frameEl.style.transform = `translate(-50%,-50%) scale(${Math.max(.1, s)})`; }
new ResizeObserver(fit).observe(wrap); fit();
function toggleFS() { try { if (document.fullscreenElement) document.exitFullscreen(); else wrap.requestFullscreen?.().catch(() => {}); } catch (e) {} }
$('#fsBtn').onclick = () => { ensureAudio(); toggleFS(); };
$('#muteBtn').onclick = () => { ensureAudio(); setMuted(!muted); };
$('#nextBtn').onclick = () => { ensureAudio(); advance(); };
frameEl.addEventListener('pointerdown', () => ensureAudio());
show('title');
requestAnimationFrame(frame);
})();
</script>
